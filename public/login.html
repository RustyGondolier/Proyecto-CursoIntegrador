<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>UTP Parking</title>

	<link rel="stylesheet" href="/shared/css/variables.css">
  <link rel="stylesheet" href="/shared/css/reset.css">
  <link rel="stylesheet" href="/shared/css/global.css">
  <link rel="stylesheet" href="/shared/css/components.css">

	<style>

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--secondary)
        );
    }

    .login-card{
      width:min(420px,92%);
      background:var(--white);
      border-radius:24px;
      padding:32px;
      box-shadow:
        0 10px 40px rgba(0,0,0,.15);
    }

    .logo{
      text-align:center;
      margin-bottom:24px;
    }

    .logo h1{
      color:var(--primary);
      font-size:2rem;
    }

    .form{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

  </style>
</head>

<body>
	<div class="login-card">

    <div class="logo">
      <h1>UTP Parking</h1>
      <p>Sistema de estacionamiento inteligente</p>
    </div>

    <form class="form" id="loginForm">

      <div class="input-group">
        <label>Código universitario</label>

        <input
          type="text"
          id="codigo"
          class="input"
          required
        >
      </div>

      <div class="input-group">
        <label>Contraseña</label>

        <input
          type="password"
          id="password"
          class="input"
          required
        >
      </div>

      <button class="btn btn-primary">
        Ingresar
      </button>

    </form>

  </div>

  <script src="/shared/js/config.js"></script>
  <script src="/shared/js/api.js"></script>
  <script src="/shared/js/storage.js"></script>
  <script src="/shared/js/auth.js"></script>
	<script src="/shared/js/login.js"></script>

</body>
</html>
