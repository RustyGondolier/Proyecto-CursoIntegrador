<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Registro | UTP Parking</title>

  <link rel="stylesheet" href="./shared/css/variables.css">
  <link rel="stylesheet" href="./shared/css/global.css">
  <link rel="stylesheet" href="./css/register.css">
</head>
<body>

  <main class="register-container">

    <div class="register-card">

      <h1>Crear Cuenta</h1>

      <form id="registerForm">

    <!-- DATOS PERSONALES -->

    <div class="form-section">

        <h2>Datos personales</h2>

        <input
            type="text"
            id="nombre"
            placeholder="Nombre completo"
            required
        >

        <input
            type="text"
            id="codigo"
            placeholder="Código universitario"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            required
        >

        <input
            type="text"
            id="telefono"
            placeholder="Teléfono"
        >

        <input
            type="text"
            id="dni"
            placeholder="DNI"
        >

        <label>Fecha de nacimiento</label>

        <input
            type="date"
            id="fechaNacimiento"
            required
        >

        <input
            type="email"
            id="correo"
            placeholder="Correo institucional"
        >

    </div>

    <!-- LICENCIA -->

    <div class="form-section">

        <h2>Licencia de conducir</h2>

        <input
            type="text"
            id="licencia"
            placeholder="Número de licencia"
        >

        <label>Fecha de vencimiento</label>

        <input
            type="date"
            id="fechaLicencia"
        >

    </div>

    <!-- CONADIS -->

    <div class="form-section">

        <h2>CONADIS</h2>

        <p>¿Usted cuenta con carnet CONADIS?</p>

        <div class="radio-group">

            <label>
                <input
                    type="radio"
                    name="conadisTiene"
                    value="si"
                >
                Sí
            </label>

            <label>
                <input
                    type="radio"
                    name="conadisTiene"
                    value="no"
                    checked
                >
                No
            </label>

        </div>

        <div
            id="conadisContainer"
            style="display:none;"
        >

            <input
                type="text"
                id="conadis"
                placeholder="Código CONADIS"
            >

        </div>

    </div>

    <!-- VEHÍCULO -->

    <div class="form-section">

        <h2>Vehículo</h2>

        <select id="tipoVehiculo">

            <option value="1">
                Automóvil
            </option>

            <option value="2">
                Motocicleta
            </option>

            <option value="3">
                Mototaxi
            </option>

        </select>

        <input
            type="text"
            id="placa"
            placeholder="ABC-123"
            required
        >

        <input
            type="text"
            id="modelo"
            placeholder="Modelo"
        >

    </div>

    <button type="submit">
        Registrarse
    </button>

</form>

      <p id="mensaje"></p>

      <a href="./login.html">
        Ya tengo una cuenta
      </a>

    </div>

  </main>

  <script src="./js/register.js"></script>

</body>
</html>
