<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - UTP Parking</title>
  <link rel="stylesheet" href="/shared/css/variables.css">
  <link rel="stylesheet" href="/shared/css/reset.css">
  <link rel="stylesheet" href="/shared/css/global.css">
  <link rel="stylesheet" href="/shared/css/components.css">
  <link rel="stylesheet" href="/shared/css/auth.css">
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <h1>Crear cuenta</h1>
        <p>Registro de usuario UTP Parking</p>
      </div>

      <form id="registerForm" class="auth-form">
        <div class="input-group">
          <label for="codigo">Código universitario</label>
          <input type="text" id="codigo" class="input" required>
        </div>

        <div class="input-group">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" class="input" required>
        </div>

        <div class="input-group">
          <label for="correo">Correo institucional</label>
          <input type="email" id="correo" class="input" required>
        </div>

        <div class="input-group">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" class="input" required>
        </div>

        <div class="input-group">
          <label for="dni">DNI</label>
          <input type="text" id="dni" class="input" required>
        </div>

        <div class="input-group">
          <label for="fechaNacimiento">Fecha de nacimiento</label>
          <input type="date" id="fechaNacimiento" class="input" required>
        </div>

        <div class="input-group">
          <label for="placa">Placa del vehículo</label>
          <input type="text" id="placa" class="input" required>
        </div>

        <div class="input-group">
          <label for="modelo">Modelo del vehículo</label>
          <input type="text" id="modelo" class="input" required>
        </div>

        <div class="input-group">
          <label for="tipoVehiculo">Tipo de vehículo</label>
          <select id="tipoVehiculo" class="input" required>
            <option value="">Seleccionar</option>
            <option value="1">Automóvil</option>
            <option value="2">Motocicleta</option>
            <option value="3">Mototaxi</option>
          </select>
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" class="input" required>
        </div>

        <div class="input-group">
          <label>¿Cuenta con carnet o permiso CONADIS?</label>
          <div class="radio-group" style="display: flex; gap: 20px; margin-top: 8px; margin-bottom: 8px;">
            <label style="display: flex; align-items: center; gap: 5px; font-weight: normal; cursor: pointer;">
              <input 
                type="radio" 
                name="hasConadis" 
                value="si"
              > Sí
            </label>
            <label style="display: flex; align-items: center; gap: 5px; font-weight: normal; cursor: pointer;">
              <input 
                type="radio" 
                name="hasConadis" 
                value="no" 
                checked
              > No
            </label>
          </div>
        </div>

        <div class="input-group" id="conadisWrapper" style="display: none; margin-top: 10px;">
          <label for="codigo_conadis">Código de registro CONADIS:</label>
          <input 
            type="text" 
            id="codigo_conadis" 
            class="input" 
            placeholder="Ej: P-000000"
          >
        </div>

        <button type="submit" class="btn btn-primary">Registrarse</button>
        <a href="/login.html" class="auth-link">Ya tengo cuenta</a>
      </form>
    </div>
  </main>

  <script src="/shared/js/config.js"></script>
  <script src="/shared/js/api.js"></script>
  <script src="/shared/js/register.js"></script>

</body>
</html>
