<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes | Dirección - UTP Parking</title>
  <link rel="stylesheet" href="/shared/css/variables.css">
  <link rel="stylesheet" href="/shared/css/layout.css">
  <link rel="stylesheet" href="/shared/css/header.css">
  <link rel="stylesheet" href="/shared/css/sidebar.css">
  <link rel="stylesheet" href="/shared/css/buttons.css">
  <link rel="stylesheet" href="/shared/css/cards.css">
  <link rel="stylesheet" href="./reportes.css">
</head>
<body>
  <div id="headerContainer"></div>
  <div class="app-layout">
    <div id="sidebarContainer"></div>
    <main class="content">
      <section class="card welcome-card">
        <h1 id="welcomeText">Reportes de Incidencias</h1>
        <p>Información general de reportes e infracciones</p>
      </section>

      <section class="card controls-card">
        <div class="controls-row">
          <div class="chart-type-selector" data-target="chartReportes">
            <button class="chart-type-btn active" data-type="doughnut">Dona</button>
            <button class="chart-type-btn" data-type="bar">Barra</button>
            <button class="chart-type-btn" data-type="polarArea">Radial</button>
          </div>
          <div class="filter-group">
            <span class="filter-label">Rango:</span>
            <input type="date" id="fechaInicio" class="filter-input">
            <span class="filter-sep">→</span>
            <input type="date" id="fechaFin" class="filter-input">
          </div>
        </div>
      </section>

      <section class="card chart-card">
        <div class="chart-container chart-container-sm">
          <canvas id="chartReportes"></canvas>
        </div>
        <p class="no-data d-none">Sin datos disponibles para el periodo indicado</p>
        <p class="error-msg d-none">Error al cargar la gráfica</p>
      </section>

      <section class="card" id="tablaContainer">
        <div id="tablaBody">
          <p class="empty-message">Seleccione un período para ver el resumen.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="/chartjs/chart.umd.min.js"></script>
  <script src="/shared/api/api.js"></script>
  <script src="/shared/js/auth.js"></script>
  <script src="/shared/js/layout.js"></script>
  <script src="/shared/js/sidebar.js"></script>
  <script src="/shared/api/direccion.api.js"></script>
  <script src="./reportes.js"></script>
</body>
</html>
