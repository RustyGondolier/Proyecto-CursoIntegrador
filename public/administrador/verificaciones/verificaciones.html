<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificaciones | Administrador - UTP Parking</title>

  <link rel="stylesheet" href="/shared/css/variables.css">
  <link rel="stylesheet" href="/shared/css/layout.css">
  <link rel="stylesheet" href="/shared/css/header.css">
  <link rel="stylesheet" href="/shared/css/sidebar.css">
  <link rel="stylesheet" href="/shared/css/buttons.css">
  <link rel="stylesheet" href="/shared/css/cards.css">
  <link rel="stylesheet" href="/shared/css/modal.css">
  <link rel="stylesheet" href="./verificaciones.css">
</head>
<body>
  <div id="headerContainer"></div>

  <div class="app-layout">
    <div id="sidebarContainer"></div>

    <main class="content">

      <section class="card ver-header">
        <div class="ver-header-left">
          <span class="ver-header-icon">📋</span>
          <div>
            <h1>Verificación de Usuarios</h1>
            <p>Revisa los datos de los usuarios pendientes de verificación.</p>
          </div>
        </div>
        <span class="ver-count" id="verCount">0</span>
      </section>

      <section class="card ver-list-card">
        <div class="ver-list-head">
          <h2>Perfiles pendientes de verificación</h2>
        </div>
        <div id="verList" class="ver-list">
          <p class="empty-state">Cargando...</p>
        </div>
      </section>

    </main>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-dialog modal-dialog-xl">
      <div class="modal-head">
        <h2>Detalle del perfil</h2>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body" id="detailBody"></div>
    </div>
  </div>

  <div class="modal" id="suspendModal">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-dialog modal-dialog-md">
      <div class="modal-head">
        <h2>Suspender cuenta</h2>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body">
        <p class="suspend-info">Se suspenderá la cuenta de <strong id="suspendUserName">—</strong>. Indica el motivo:</p>
        <textarea id="suspendMotivo" class="suspend-textarea" rows="4" placeholder="Describe el motivo de la suspensión (mín. 5 caracteres)"></textarea>
        <div id="suspendError" class="suspend-error" style="display:none"></div>
        <div class="suspend-actions">
          <button class="btn btn-secondary" data-close-modal>Cancelar</button>
          <button class="btn btn-danger" id="confirmSuspendBtn">Suspender cuenta</button>
        </div>
      </div>
    </div>
  </div>

  <div id="successToast" class="ver-toast" style="display:none"></div>
  <div id="errorToast" class="ver-toast ver-toast-error" style="display:none"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/api/api.js"></script>
  <script src="/shared/js/auth.js"></script>
  <script src="/shared/js/layout.js"></script>
  <script src="/shared/js/sidebar.js"></script>
  <script src="/shared/api/administrador.api.js"></script>
  <script src="./verificaciones.js"></script>
</body>
</html>
