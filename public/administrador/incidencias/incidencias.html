<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes Prioritarios | Administrador - UTP Parking</title>

  <link rel="stylesheet" href="/shared/css/variables.css">
  <link rel="stylesheet" href="/shared/css/layout.css">
  <link rel="stylesheet" href="/shared/css/header.css">
  <link rel="stylesheet" href="/shared/css/sidebar.css">
  <link rel="stylesheet" href="/shared/css/buttons.css">
  <link rel="stylesheet" href="/shared/css/cards.css">
  <link rel="stylesheet" href="/shared/css/modal.css">
  <link rel="stylesheet" href="./incidencias.css">
</head>
<body>
  <div id="headerContainer"></div>

  <div class="app-layout">
    <div id="sidebarContainer"></div>

    <main class="content">

      <section class="inc-header">
        <div class="inc-header-left">
          <span class="inc-header-icon">!</span>
          <div>
            <h1>Reportes Prioritarios</h1>
            <p>Incidencias escaladas por supervisores que requieren atencion.</p>
          </div>
        </div>
        <span class="inc-count" id="incCount">0</span>
      </section>

      <section class="card inc-table-card">
        <div class="inc-table-head">
          <h2>Pendientes de resolver</h2>
        </div>
        <div id="incTableContainer" class="inc-table-container">
          <p class="empty-state">Cargando...</p>
        </div>
      </section>

    </main>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-dialog modal-dialog-xl">
      <div class="modal-head">
        <h2>Detalle del reporte</h2>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body" id="detailBody"></div>
    </div>
  </div>

  <div id="successToast" class="inc-toast" style="display:none"></div>
  <div id="errorToast" class="inc-toast inc-toast-error" style="display:none"></div>

  <script src="/shared/api/api.js"></script>
  <script src="/shared/js/auth.js"></script>
  <script src="/shared/js/layout.js"></script>
  <script src="/shared/js/sidebar.js"></script>
  <script src="/shared/api/administrador.api.js"></script>
  <script src="./incidencias.js"></script>
</body>
</html>
