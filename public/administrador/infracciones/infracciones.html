<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infracciones | Administrador - UTP Parking</title>

  <link rel="stylesheet" href="/shared/css/variables.css">
  <link rel="stylesheet" href="/shared/css/layout.css">
  <link rel="stylesheet" href="/shared/css/header.css">
  <link rel="stylesheet" href="/shared/css/sidebar.css">
  <link rel="stylesheet" href="/shared/css/buttons.css">
  <link rel="stylesheet" href="/shared/css/cards.css">
  <link rel="stylesheet" href="/shared/css/modal.css">
  <link rel="stylesheet" href="./infracciones.css">
</head>
<body>
  <div id="headerContainer"></div>

  <div class="app-layout">
    <div id="sidebarContainer"></div>

    <main class="content">

      <section class="card inf-header">
        <div class="inf-header-left">
          <span class="inf-header-icon">!</span>
          <div>
            <h1>Infracciones</h1>
            <p>Historial completo de infracciones registradas por supervisores.</p>
          </div>
        </div>
        <span class="inf-count" id="infCount">0</span>
      </section>

      <section class="card inf-filters-card">
        <div class="inf-filters">
          <div class="inf-search">
            <input type="text" id="searchInput" placeholder="Buscar por usuario o placa..." class="inf-search-input">
          </div>
          <select id="filterTipo" class="inf-select">
            <option value="">Todos los tipos</option>
            <option value="1">Mal estacionado</option>
            <option value="2">Perdida de identificador</option>
            <option value="3">Uso de plaza incorrecta</option>
            <option value="4">Obstruccion de transito</option>
            <option value="5">Conduccion riesgosa</option>
          </select>
          <select id="filterUserEstado" class="inf-select">
            <option value="">Todos los estados</option>
            <option value="activa">Cuenta activa</option>
            <option value="suspendida">Cuenta suspendida</option>
          </select>
          <input type="date" id="filterFechaDesde" class="inf-date-input" title="Desde">
          <input type="date" id="filterFechaHasta" class="inf-date-input" title="Hasta">
        </div>
      </section>

      <section class="card inf-table-card">
        <div class="inf-table-head">
          <h2>Lista de infracciones</h2>
        </div>
        <div id="infTableContainer" class="inf-table-container">
          <p class="empty-state">Cargando...</p>
        </div>
      </section>

    </main>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-dialog modal-dialog-xl">
      <div class="modal-head">
        <h2>Detalle de infraccion</h2>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body" id="detailBody"></div>
    </div>
  </div>

  <div class="modal" id="suspendModal">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-dialog modal-dialog-md">
      <div class="modal-head">
        <h2>Suspender cuenta</h2>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body">
        <p class="inf-suspend-info">Se suspendera la cuenta de <strong id="suspendUserName">—</strong>. Indica el motivo:</p>
        <textarea id="suspendMotivo" class="inf-suspend-textarea" rows="4" placeholder="Describe el motivo de la suspension (min. 5 caracteres)"></textarea>
        <div id="suspendError" class="inf-suspend-error" style="display:none"></div>
        <div class="inf-suspend-actions">
          <button class="btn btn-secondary" data-close-modal>Cancelar</button>
          <button class="btn btn-danger" id="confirmSuspendBtn">Suspender cuenta</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="reactivarModal">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-dialog modal-dialog-sm">
      <div class="modal-head">
        <h2>Reactivar cuenta</h2>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body">
        <p id="reactivarInfo" class="inf-reactivar-info">¿Estas seguro de reactivar la cuenta de <strong>—</strong>?</p>
        <div id="reactivarError" class="inf-suspend-error" style="display:none"></div>
        <div class="inf-suspend-actions">
          <button class="btn btn-secondary" data-close-modal>Cancelar</button>
          <button class="btn btn-success" id="confirmReactivarBtn">Reactivar cuenta</button>
        </div>
      </div>
    </div>
  </div>

  <div id="successToast" class="inf-toast" style="display:none"></div>
  <div id="errorToast" class="inf-toast inf-toast-error" style="display:none"></div>

  <script src="/shared/api/api.js"></script>
  <script src="/shared/js/auth.js"></script>
  <script src="/shared/js/layout.js"></script>
  <script src="/shared/js/sidebar.js"></script>
  <script src="/shared/api/administrador.api.js"></script>
  <script src="./infracciones.js"></script>
</body>
</html>
