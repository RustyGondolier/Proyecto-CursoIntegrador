<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios | Administrador - UTP Parking</title>

  <link rel="stylesheet" href="/shared/css/variables.css">
  <link rel="stylesheet" href="/shared/css/layout.css">
  <link rel="stylesheet" href="/shared/css/header.css">
  <link rel="stylesheet" href="/shared/css/sidebar.css">
  <link rel="stylesheet" href="/shared/css/buttons.css">
  <link rel="stylesheet" href="/shared/css/cards.css">
  <link rel="stylesheet" href="/shared/css/modal.css">
  <link rel="stylesheet" href="./usuarios.css">
</head>
<body>
  <div id="headerContainer"></div>

  <div class="app-layout">
    <div id="sidebarContainer"></div>

    <main class="content">

      <section class="card usr-header">
        <div class="usr-header-left">
          <span class="usr-header-icon">👥</span>
          <div>
            <h1>Usuarios</h1>
            <p>Gestiona las cuentas de estudiantes y docentes.</p>
          </div>
        </div>
        <span class="usr-count" id="usrCount">0</span>
      </section>

      <section class="card usr-filters-card">
        <div class="usr-filters">
          <div class="usr-search">
            <input type="text" id="searchInput" placeholder="Buscar por nombre o código..." class="usr-search-input">
          </div>
          <select id="filterRol" class="usr-select">
            <option value="">Todos los roles</option>
            <option value="estudiante">Estudiante</option>
            <option value="docente">Docente</option>
          </select>
          <select id="filterEstado" class="usr-select">
            <option value="">Todos los estados</option>
            <option value="activa">Activa</option>
            <option value="suspendida">Suspendida</option>
          </select>
          <input type="date" id="filterFechaDesde" class="usr-date-input" title="Registrado desde">
          <input type="date" id="filterFechaHasta" class="usr-date-input" title="Registrado hasta">
        </div>
      </section>

      <section class="card usr-table-card">
        <div class="usr-table-head">
          <h2>Lista de usuarios</h2>
        </div>
        <div id="usrTableContainer" class="usr-table-container">
          <p class="empty-state">Cargando...</p>
        </div>
      </section>

    </main>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-dialog modal-dialog-xl">
      <div class="modal-head">
        <h2>Detalle del usuario</h2>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body" id="detailBody"></div>
    </div>
  </div>

  <div class="modal" id="suspendModal">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-dialog modal-dialog-md">
      <div class="modal-head">
        <h2>Suspender cuenta</h2>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body">
        <p class="usr-suspend-info">Se suspenderá la cuenta de <strong id="suspendUserName">—</strong>. Indica el motivo:</p>
        <textarea id="suspendMotivo" class="usr-suspend-textarea" rows="4" placeholder="Describe el motivo de la suspensión (mín. 5 caracteres)"></textarea>
        <div id="suspendError" class="usr-suspend-error" style="display:none"></div>
        <div class="usr-suspend-actions">
          <button class="btn btn-secondary" data-close-modal>Cancelar</button>
          <button class="btn btn-danger" id="confirmSuspendBtn">Suspender cuenta</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="reactivarModal">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-dialog modal-dialog-sm">
      <div class="modal-head">
        <h2>Reactivar cuenta</h2>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body">
        <p id="reactivarInfo" class="usr-reactivar-info">¿Estás seguro de reactivar la cuenta de <strong>—</strong>?</p>
        <div id="reactivarError" class="usr-suspend-error" style="display:none"></div>
        <div class="usr-suspend-actions">
          <button class="btn btn-secondary" data-close-modal>Cancelar</button>
          <button class="btn btn-success" id="confirmReactivarBtn">Reactivar cuenta</button>
        </div>
      </div>
    </div>
  </div>

  <div id="successToast" class="usr-toast" style="display:none"></div>
  <div id="errorToast" class="usr-toast usr-toast-error" style="display:none"></div>

  <script src="/shared/api/api.js"></script>
  <script src="/shared/js/auth.js"></script>
  <script src="/shared/js/layout.js"></script>
  <script src="/shared/js/sidebar.js"></script>
  <script src="/shared/api/administrador.api.js"></script>
  <script src="./usuarios.js"></script>
</body>
</html>
