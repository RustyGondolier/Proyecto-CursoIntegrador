<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Iniciar sesión
  </title>

  <link
    rel="stylesheet"
    href="/shared/css/auth.css"
  >

</head>

<body>

  <div class="auth-container">

    <div class="auth-card">

      <div class="logo-area">

        <img
          src="/assets/images/logo-utp-parking.png"
          alt="UTP Parking"
          class="logo"
        >

        <h1>
          UTP Parking
        </h1>

      </div>

      <form id="loginForm">

        <div class="input-group">

          <label>
            Código institucional
          </label>

          <input
            type="text"
            id="codigo"
            required
            placeholder="U202012345"
          >

        </div>

        <div class="input-group">

          <label>
            Contraseña
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              required
            >

            <button
              type="button"
              id="togglePassword"
            >
              👁
            </button>

          </div>

        </div>

        <button
          type="submit"
          class="btn-primary"
        >
          Iniciar sesión
        </button>

      </form>

      <p
        id="mensaje"
        class="mensaje"
      ></p>

      <div class="footer-links">

        <a href="/auth/register.html">
          Crear cuenta
        </a>

        <a href="/">
          Volver al inicio
        </a>

      </div>

    </div>

  </div>

  <script src="/shared/api/api.js"></script>
  <script src="/shared/js/auth.js"></script>
  <script src="/auth/js/login.js"></script>

</body>

</html>
