<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresos | Supervisor - UTP Parking</title>

  <link rel="stylesheet" href="/shared/css/variables.css">
  <link rel="stylesheet" href="/shared/css/layout.css">
  <link rel="stylesheet" href="/shared/css/header.css">
  <link rel="stylesheet" href="/shared/css/sidebar.css">
  <link rel="stylesheet" href="/shared/css/buttons.css">
  <link rel="stylesheet" href="/shared/css/cards.css">
  <link rel="stylesheet" href="./ingresos.css">
</head>
<body>
  <div id="headerContainer"></div>

  <div class="app-layout">
    <div id="sidebarContainer"></div>

    <main class="content">
      <section class="card search-section">
        <h1>Registro de Ingreso</h1>
        <p class="search-subtitle">Busque el vehículo por placa para confirmar su ingreso</p>

        <div class="search-bar">
          <input
            type="text"
            id="placaInput"
            class="search-input"
            placeholder="Ingrese la placa (ej: ABC-123)"
            maxlength="20"
            autocomplete="off"
          >
          <button id="searchBtn" class="btn btn-primary">Buscar</button>
        </div>
        <p id="searchError" class="search-error"></p>
      </section>

      <div id="resultContainer" class="result-container hidden">
        <section id="userInfoCard" class="card user-card"></section>

        <section id="plazasSection" class="card plazas-section hidden">
          <div class="section-header">
            <h2>Plazas Disponibles</h2>
            <span id="plazasCount" class="plazas-count"></span>
          </div>
          <div id="plazasGrid" class="plazas-grid"></div>
          <div class="confirm-bar">
            <p id="selectedPlazaInfo" class="selected-info">Seleccione una plaza disponible</p>
            <button id="confirmBtn" class="btn btn-primary" disabled>Confirmar Ingreso</button>
          </div>
        </section>
      </div>

      <section id="emptyResult" class="card empty-result hidden">
        <p>Realice una búsqueda para comenzar</p>
      </section>
    </main>
  </div>

  <script src="/shared/api/api.js"></script>
  <script src="/shared/js/auth.js"></script>
  <script src="/shared/js/layout.js"></script>
  <script src="/shared/js/sidebar.js"></script>
  <script src="/socket.io/socket.io.min.js"></script>
  <script src="/shared/js/websocket.js"></script>
  <script src="./ingresos.js"></script>
</body>
</html>
