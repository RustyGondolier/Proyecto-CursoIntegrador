<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incidencias | Supervisor - UTP Parking</title>

  <link rel="stylesheet" href="/shared/css/variables.css">
  <link rel="stylesheet" href="/shared/css/layout.css">
  <link rel="stylesheet" href="/shared/css/header.css">
  <link rel="stylesheet" href="/shared/css/sidebar.css">
  <link rel="stylesheet" href="/shared/css/buttons.css">
  <link rel="stylesheet" href="/shared/css/cards.css">
  <link rel="stylesheet" href="/shared/css/modal.css">
  <link rel="stylesheet" href="./incidencias.css">
</head>
<body>
  <div id="headerContainer"></div>

  <div class="app-layout">
    <div id="sidebarContainer"></div>

    <main class="content">
      <section class="card inc-header">
        <div class="inc-header-left">
          <span class="inc-header-icon">⚠️</span>
          <div>
            <h1>Gestión de Incidencias</h1>
            <p>Revisa y atiende los reportes de incidencias enviados por los usuarios.</p>
          </div>
        </div>
        <span class="inc-count" id="incCount">0</span>
      </section>

      <div class="inc-filters" id="incFilters">
        <button class="inc-filter active" data-estado="">Todas</button>
        <button class="inc-filter" data-estado="1">Pendientes</button>
        <button class="inc-filter" data-estado="2">En atención</button>
        <button class="inc-filter" data-estado="3">Resueltas</button>
        <button class="inc-filter" data-estado="4">Prioritarias</button>
      </div>

      <section class="card inc-list-card">
        <div class="inc-list-head">
          <h2>Reportes de incidencias</h2>
        </div>
        <div id="incList" class="inc-list">
          <p class="empty-state">Cargando reportes...</p>
        </div>
      </section>
    </main>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-dialog modal-dialog-xl">
      <div class="modal-head">
        <h2>Detalle del reporte</h2>
        <button class="modal-close" data-close-modal>&times;</button>
      </div>
      <div class="modal-body" id="detailBody"></div>
    </div>
  </div>

  <div id="errorToast" class="error-toast" style="display:none"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/api/api.js"></script>
  <script src="/shared/js/auth.js"></script>
  <script src="/shared/js/layout.js"></script>
  <script src="/shared/js/sidebar.js"></script>
  <script src="/shared/api/reporte.api.js"></script>
  <script src="./incidencias.js"></script>
</body>
</html>
