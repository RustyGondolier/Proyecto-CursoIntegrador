<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Seleccionar sede</title>

	<link rel="stylesheet" href="/shared/css/variables.css">
  <link rel="stylesheet" href="/shared/css/reset.css">
  <link rel="stylesheet" href="/shared/css/global.css">

	<style>
		body{
      background:var(--background);
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }

    .campus-container{
      width:min(900px,92%);
    }

    .campus-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:18px;
    }

    .campus-card{
      background:var(--white);
      border-radius:20px;
      padding:24px;
      box-shadow:var(--shadow);
      cursor:pointer;
      transition:var(--transition);
    }

    .campus-card:hover{
      transform:translateY(-4px);
    }

    @media(min-width:768px){
      .campus-grid{
        grid-template-columns:repeat(3,1fr);
      }
    }
	</style>
</head>

<body>
	<div class="campus-container">

    <h1 class="section-title">
      Selecciona una sede
    </h1>

    <div class="campus-grid">

      <div
        class="campus-card"
        onclick="selectCampus(1,'Lima Norte')"
      >
        <h2>Lima Norte</h2>
        <p>Acceder estacionamientos</p>
      </div>

      <div
        class="campus-card"
        onclick="selectCampus(2,'Lima Centro')"
      >
        <h2>Lima Centro</h2>
        <p>Acceder estacionamientos</p>
      </div>

      <div
        class="campus-card"
        onclick="selectCampus(3,'Lima Sur')"
      >
        <h2>Lima Sur</h2>
        <p>Acceder estacionamientos</p>
      </div>

    </div>

  </div>

  <script>

    function selectCampus(id,nombre){

      sessionStorage.setItem(
        'sedeActiva',
        JSON.stringify({
          id,
          nombre
        })
      );

      const usuario = JSON.parse(
        sessionStorage.getItem('usuario')
      );

      switch(usuario.rol){

        case 'supervisor':
          window.location.href =
            '/supervisor/dashboard.html';
        break;

        case 'administrativo':
          window.location.href =
            '/admin/dashboard.html';
        break;

        case 'directora':
          window.location.href =
            '/director/dashboard.html';
        break;

        default:
          window.location.href =
            '/user/dashboard.html';
      }
    }

  </script>
</body>
</html>
