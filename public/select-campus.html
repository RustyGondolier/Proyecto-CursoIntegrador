<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Seleccionar sede</title>

  <link
    rel="stylesheet"
    href="/shared/css/global.css"
  >

  <link
    rel="stylesheet"
    href="/css/select-campus.css"
  >

</head>
<body>

  <main class="campus-page">

    <h1>Selecciona una sede</h1>

    <div class="campus-list">

      <button
        class="campus-card active"
        data-id="1"
        data-nombre="Lima Sur"
      >
        Lima Sur
      </button>

      <button
        class="campus-card disabled"
        disabled
      >
        Lima Centro
        <span>Próximamente</span>
      </button>

      <button
        class="campus-card disabled"
        disabled
      >
        Lima Norte
        <span>Próximamente</span>
      </button>

    </div>

  </main>

  <script src="/js/select-campus.js"></script>

</body>
</html>
