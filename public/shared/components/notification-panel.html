<div id="notificationPanel" class="notification-panel">
  <div class="notification-panel-header">
    <h3>Notificaciones</h3>
    <button id="closeNotificationPanel" class="notification-close">&times;</button>
  </div>
  <div class="notification-panel-actions">
    <button id="markAllReadBtn" class="mark-all-read">Marcar todas como leídas</button>
  </div>
  <div id="notificationList" class="notification-list">

  </div>
</div>
<div id="notificationOverlay" class="notification-overlay hidden"></div>
